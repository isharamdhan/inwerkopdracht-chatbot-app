name: inwerkopdracht-chatbot-app

services:
  app:
    build: .
    command: sh -c "npm install && npm run db:migrate && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Whole project is bind-mounted, so the container installs node_modules
      # straight into ./node_modules on the host (shared, visible to your IDE).
      - .:/app

  db:
    # No official mysql:*-alpine image exists (those tags were removed); use MariaDB if you want Alpine.
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
